<div class="bg-white">
    <div class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8">
        <h2 class="text-3xl font-bold tracking-tight text-gray-900 mb-8">My Purchases</h2>

        <div class="overflow-hidden bg-white shadow sm:rounded-md">
            <ul role="list" class="divide-y divide-gray-200">
                <li *ngFor="let purchase of purchases">
                    <div class="px-4 py-4 sm:px-6">
                        <div class="flex items-center justify-between">
                            <p class="truncate text-sm font-medium text-blue-600">Receipt #{{ purchase.id }}</p>
                            <div class="ml-2 flex flex-shrink-0">
                                <p
                                    class="inline-flex rounded-full bg-green-100 px-2 text-xs font-semibold leading-5 text-green-800">
                                    Completed
                                </p>
                            </div>
                        </div>
                        <div class="mt-2 sm:flex sm:justify-between">
                            <div class="sm:flex">
                                <p class="flex items-center text-sm text-gray-500">
                                    Date: {{ purchase.receiptDate | date:'medium' }}
                                </p>
                                <p class="mt-2 flex items-center text-sm text-gray-500 sm:mt-0 sm:ml-6">
                                    Total: ${{ purchase.grossTotal + purchase.ivaTotal | number:'1.2-2' }}
                                </p>
                            </div>
                            <div class="mt-2 flex items-center text-sm text-gray-500 sm:mt-0">
                                <button (click)="printReceipt(purchase)" class="text-blue-600 hover:text-blue-900">Print
                                    Receipt</button>
                            </div>
                        </div>
                    </div>
                </li>
                <li *ngIf="purchases.length === 0" class="px-4 py-4 sm:px-6 text-center text-gray-500">
                    No purchases found.
                </li>
            </ul>
        </div>
    </div>
</div>
