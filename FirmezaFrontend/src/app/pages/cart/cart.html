<div class="bg-white">
    <div class="mx-auto max-w-2xl px-4 py-16 sm:px-6 sm:py-24 lg:max-w-7xl lg:px-8">
        <h2 class="text-3xl font-bold tracking-tight text-gray-900">Shopping Cart</h2>

        <div class="mt-8">
            <div class="flow-root">
                <ul role="list" class="-my-6 divide-y divide-gray-200">
                    <li *ngFor="let item of cartItems" class="flex py-6">
                        <div class="h-24 w-24 flex-shrink-0 overflow-hidden rounded-md border border-gray-200">
                            <img [src]="item.product.imageUrl || 'https://via.placeholder.com/150'"
                                [alt]="item.product.name" class="h-full w-full object-cover object-center">
                        </div>

                        <div class="ml-4 flex flex-1 flex-col">
                            <div>
                                <div class="flex justify-between text-base font-medium text-gray-900">
                                    <h3>
                                        <a href="#">{{ item.product.name }}</a>
                                    </h3>
                                    <p class="ml-4">${{ item.product.price * item.quantity }}</p>
                                </div>
                                <p class="mt-1 text-sm text-gray-500">{{ item.product.type }}</p>
                            </div>
                            <div class="flex flex-1 items-end justify-between text-sm">
                                <div class="flex items-center">
                                    <button (click)="updateQuantity(item.product.id, item.quantity - 1)"
                                        class="px-2 py-1 border rounded">-</button>
                                    <span class="mx-2 text-gray-500">Qty {{ item.quantity }}</span>
                                    <button (click)="updateQuantity(item.product.id, item.quantity + 1)"
                                        class="px-2 py-1 border rounded">+</button>
                                </div>

                                <div class="flex">
                                    <button type="button" (click)="removeItem(item.product.id)"
                                        class="font-medium text-blue-600 hover:text-blue-500">Remove</button>
                                </div>
                            </div>
                        </div>
                    </li>
                    <li *ngIf="cartItems.length === 0" class="py-6 text-center text-gray-500">
                        Your cart is empty.
                    </li>
                </ul>
            </div>
        </div>

        <div class="border-t border-gray-200 px-4 py-6 sm:px-6 mt-8" *ngIf="cartItems.length > 0">
            <div class="flex justify-between text-base font-medium text-gray-900">
                <p>Subtotal</p>
                <p>${{ total }}</p>
            </div>
            <p class="mt-0.5 text-sm text-gray-500">Shipping and taxes calculated at checkout.</p>
            <div class="mt-6">
                <button (click)="checkout()"
                    class="flex items-center justify-center rounded-md border border-transparent bg-blue-600 px-6 py-3 text-base font-medium text-white shadow-sm hover:bg-blue-700 w-full">Checkout</button>
            </div>
            <div class="mt-6 flex justify-center text-center text-sm text-gray-500">
                <p>
                    or
                    <a routerLink="/catalog" class="font-medium text-blue-600 hover:text-blue-500">
                        Continue Shopping
                        <span aria-hidden="true"> &rarr;</span>
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
