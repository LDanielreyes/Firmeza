<div class="bg-white">
    <div class="mx-auto max-w-2xl px-4 py-16 sm:px-6 sm:py-24 lg:max-w-7xl lg:px-8">
        <h2 class="text-2xl font-bold tracking-tight text-gray-900">Products</h2>

        <div class="mt-6 flex gap-4 mb-8">
            <input type="text" [(ngModel)]="searchTerm" (input)="onSearch()" placeholder="Search products..."
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">

            <select [(ngModel)]="selectedType" (change)="onSearch()"
                class="shadow border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                <option value="">All Types</option>
                <option value="Electronics">Electronics</option>
                <option value="Clothing">Clothing</option>
                <!-- Add more types as needed -->
            </select>
        </div>

        <div class="mt-6 grid grid-cols-1 gap-x-6 gap-y-10 sm:grid-cols-2 lg:grid-cols-4 xl:gap-x-8">
            <div *ngFor="let product of products" class="group relative">
                <div
                    class="aspect-h-1 aspect-w-1 w-full overflow-hidden rounded-md bg-gray-200 lg:aspect-none group-hover:opacity-75 lg:h-80">
                    <img [src]="product.imageUrl || 'https://via.placeholder.com/300'" [alt]="product.name"
                        class="h-full w-full object-cover object-center lg:h-full lg:w-full">
                </div>
                <div class="mt-4 flex justify-between">
                    <div>
                        <h3 class="text-sm text-gray-700">
                            <a href="#">
                                <span aria-hidden="true" class="absolute inset-0"></span>
                                {{ product.name }}
                            </a>
                        </h3>
                        <p class="mt-1 text-sm text-gray-500">{{ product.type }}</p>
                    </div>
                    <p class="text-sm font-medium text-gray-900">${{ product.price }}</p>
                </div>
                <div class="mt-2">
                    <button (click)="addToCart(product); $event.stopPropagation()"
                        class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-500 z-10 relative">Add to
                        Cart</button>
                </div>
            </div>
        </div>
    </div>
</div>
