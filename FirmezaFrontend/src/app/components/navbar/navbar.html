<nav class="bg-gray-800">
    <div class="mx-auto max-w-7xl px-2 sm:px-6 lg:px-8">
        <div class="relative flex h-16 items-center justify-between">
            <div class="flex flex-1 items-center justify-center sm:items-stretch sm:justify-start">
                <div class="flex flex-shrink-0 items-center">
                    <a routerLink="/" class="text-white font-bold text-xl">Firmeza</a>
                </div>
                <div class="hidden sm:ml-6 sm:block">
                    <div class="flex space-x-4">
                        <a routerLink="/" routerLinkActive="bg-gray-900 text-white"
                            [routerLinkActiveOptions]="{exact: true}"
                            class="text-gray-300 hover:bg-gray-700 hover:text-white rounded-md px-3 py-2 text-sm font-medium">Home</a>

                        <!-- Client Links -->
                        <ng-container *ngIf="(userRole$ | async) === 'Client'">
                            <a routerLink="/catalog" routerLinkActive="bg-gray-900 text-white"
                                class="text-gray-300 hover:bg-gray-700 hover:text-white rounded-md px-3 py-2 text-sm font-medium">Catalog</a>
                            <a routerLink="/cart" routerLinkActive="bg-gray-900 text-white"
                                class="text-gray-300 hover:bg-gray-700 hover:text-white rounded-md px-3 py-2 text-sm font-medium">Cart</a>
                            <a routerLink="/purchases" routerLinkActive="bg-gray-900 text-white"
                                class="text-gray-300 hover:bg-gray-700 hover:text-white rounded-md px-3 py-2 text-sm font-medium">My
                                Purchases</a>
                        </ng-container>

                        <!-- Admin Links -->
                        <ng-container *ngIf="(userRole$ | async) === 'Admin'">
                            <a routerLink="/dashboard" routerLinkActive="bg-gray-900 text-white"
                                class="text-gray-300 hover:bg-gray-700 hover:text-white rounded-md px-3 py-2 text-sm font-medium">Dashboard</a>
                            <a routerLink="/admin/products" routerLinkActive="bg-gray-900 text-white"
                                class="text-gray-300 hover:bg-gray-700 hover:text-white rounded-md px-3 py-2 text-sm font-medium">Products</a>
                            <a routerLink="/admin/clients" routerLinkActive="bg-gray-900 text-white"
                                class="text-gray-300 hover:bg-gray-700 hover:text-white rounded-md px-3 py-2 text-sm font-medium">Clients</a>
                            <a routerLink="/admin/sales" routerLinkActive="bg-gray-900 text-white"
                                class="text-gray-300 hover:bg-gray-700 hover:text-white rounded-md px-3 py-2 text-sm font-medium">Sales</a>
                        </ng-container>
                    </div>
                </div>
            </div>
            <div class="absolute inset-y-0 right-0 flex items-center pr-2 sm:static sm:inset-auto sm:ml-6 sm:pr-0">
                <ng-container *ngIf="userRole$ | async; else loginBtn">
                    <button (click)="logout()"
                        class="text-gray-300 hover:bg-gray-700 hover:text-white rounded-md px-3 py-2 text-sm font-medium">Logout</button>
                </ng-container>
                <ng-template #loginBtn>
                    <a routerLink="/login" routerLinkActive="bg-gray-900 text-white"
                        class="text-gray-300 hover:bg-gray-700 hover:text-white rounded-md px-3 py-2 text-sm font-medium">Login</a>
                    <a routerLink="/register" routerLinkActive="bg-gray-900 text-white"
                        class="text-gray-300 hover:bg-gray-700 hover:text-white rounded-md px-3 py-2 text-sm font-medium">Register</a>
                </ng-template>
            </div>
        </div>
    </div>
</nav>
