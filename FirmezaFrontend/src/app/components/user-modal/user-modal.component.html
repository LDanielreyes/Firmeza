<div class="modal-overlay" (click)="onClose()">
    <div class="modal-container" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h2 class="modal-title">{{ isEdit ? 'Edit User' : 'Add New User' }}</h2>
            <button (click)="onClose()" class="close-button">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <form (ngSubmit)="onSubmit()" class="modal-body">
            <div class="form-group">
                <label for="fullName" class="form-label">Full Name *</label>
                <input type="text" id="fullName" [(ngModel)]="formData.fullName" name="fullName" required
                    class="form-input" placeholder="Enter full name">
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email *</label>
                <input type="email" id="email" [(ngModel)]="formData.email" name="email" required class="form-input"
                    placeholder="user@example.com">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="tel" id="phone" [(ngModel)]="formData.phone" name="phone" class="form-input"
                        placeholder="Enter phone number">
                </div>

                <div class="form-group">
                    <label for="age" class="form-label">Age *</label>
                    <input type="number" id="age" [(ngModel)]="formData.age" name="age" required min="1" max="150"
                        class="form-input" placeholder="18">
                </div>
            </div>

            <div class="form-group">
                <label for="document" class="form-label">Document</label>
                <input type="text" id="document" [(ngModel)]="formData.document" name="document" class="form-input"
                    placeholder="Enter document number">
            </div>

            <div class="form-group">
                <label for="address" class="form-label">Address</label>
                <textarea id="address" [(ngModel)]="formData.address" name="address" class="form-input" rows="2"
                    placeholder="Enter address"></textarea>
            </div>

            <div class="modal-footer">
                <button type="button" (click)="onClose()" class="btn-cancel">
                    Cancel
                </button>
                <button type="submit" [disabled]="!isValid()" class="btn-submit">
                    {{ isEdit ? 'Update' : 'Create' }} User
                </button>
            </div>
        </form>
    </div>
</div>
