<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden animate-fade-in-up">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 px-6 py-4 flex justify-between items-center">
            <h3 class="text-xl font-bold text-white">{{ title }}</h3>
            <button (click)="closeModal()" class="text-white hover:text-gray-200 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Body -->
        <div class="p-6">
            <!-- File Upload Area -->
            <div *ngIf="!result && !uploading" class="mb-6">
                <label
                    class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-gray-300 rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <svg class="w-10 h-10 mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12">
                            </path>
                        </svg>
                        <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">Click para subir</span> o
                            arrastra y suelta</p>
                        <p class="text-xs text-gray-500">Excel (.xlsx)</p>
                    </div>
                    <input type="file" class="hidden" (change)="onFileSelected($event)" accept=".xlsx" />
                </label>
                <div *ngIf="file" class="mt-2 text-sm text-gray-700 font-medium flex items-center">
                    <svg class="w-4 h-4 mr-2 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    {{ file.name }}
                </div>
            </div>

            <!-- Loading State -->
            <div *ngIf="uploading" class="flex flex-col items-center justify-center py-8">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
                <p class="text-gray-600 font-medium">Procesando archivo...</p>
            </div>

            <!-- Results -->
            <div *ngIf="result" class="space-y-4">
                <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg">
                    <div class="text-center flex-1">
                        <p class="text-sm text-gray-500">Total Filas</p>
                        <p class="text-2xl font-bold text-gray-800">{{ result.totalRows }}</p>
                    </div>
                    <div class="text-center flex-1 border-l border-r border-gray-200">
                        <p class="text-sm text-gray-500">Exitosos</p>
                        <p class="text-2xl font-bold text-green-600">{{ result.successCount }}</p>
                    </div>
                    <div class="text-center flex-1">
                        <p class="text-sm text-gray-500">Errores</p>
                        <p class="text-2xl font-bold text-red-600">{{ result.errorCount }}</p>
                    </div>
                </div>

                <div *ngIf="result.errorCount > 0" class="mt-4">
                    <button (click)="toggleErrors()"
                        class="flex items-center text-sm text-red-600 hover:text-red-800 font-medium focus:outline-none">
                        <svg class="w-4 h-4 mr-1 transform transition-transform" [ngClass]="{'rotate-180': showErrors}"
                            fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
                            </path>
                        </svg>
                        {{ showErrors ? 'Ocultar detalles de errores' : 'Ver detalles de errores' }}
                    </button>

                    <div *ngIf="showErrors"
                        class="mt-2 max-h-60 overflow-y-auto border border-red-200 rounded-lg bg-red-50">
                        <table class="min-w-full divide-y divide-red-200">
                            <thead class="bg-red-100">
                                <tr>
                                    <th
                                        class="px-4 py-2 text-left text-xs font-medium text-red-700 uppercase tracking-wider">
                                        Fila</th>
                                    <th
                                        class="px-4 py-2 text-left text-xs font-medium text-red-700 uppercase tracking-wider">
                                        Campo</th>
                                    <th
                                        class="px-4 py-2 text-left text-xs font-medium text-red-700 uppercase tracking-wider">
                                        Mensaje</th>
                                    <th
                                        class="px-4 py-2 text-left text-xs font-medium text-red-700 uppercase tracking-wider">
                                        Valor</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-red-200">
                                <tr *ngFor="let err of result.errors">
                                    <td class="px-4 py-2 text-sm text-red-800">{{ err.row }}</td>
                                    <td class="px-4 py-2 text-sm text-red-800">{{ err.field }}</td>
                                    <td class="px-4 py-2 text-sm text-red-800">{{ err.message }}</td>
                                    <td class="px-4 py-2 text-sm text-red-800">{{ err.value }}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Error Message -->
            <div *ngIf="error" class="p-4 mb-4 text-sm text-red-700 bg-red-100 rounded-lg" role="alert">
                <span class="font-medium">Error!</span> {{ error }}
            </div>
        </div>

        <!-- Footer -->
        <div class="bg-gray-50 px-6 py-4 flex justify-end space-x-3">
            <button (click)="closeModal()"
                class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                {{ result ? 'Cerrar' : 'Cancelar' }}
            </button>
            <button *ngIf="!result && !uploading" (click)="upload()" [disabled]="!file"
                class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">
                Importar
            </button>
        </div>
    </div>
</div>
