<div class="modal-overlay" (click)="onClose()">
    <div class="modal-container" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h2 class="modal-title">{{ isEdit ? 'Edit Product' : 'Add New Product' }}</h2>
            <button (click)="onClose()" class="close-button">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <form (ngSubmit)="onSubmit()" class="modal-body">
            <div class="form-group">
                <label for="name" class="form-label">Product Name *</label>
                <input type="text" id="name" [(ngModel)]="formData.name" name="name" required class="form-input"
                    placeholder="Enter product name">
            </div>

            <div class="form-group">
                <label for="description" class="form-label">Description</label>
                <textarea id="description" [(ngModel)]="formData.description" name="description" class="form-input"
                    rows="3" placeholder="Enter product description"></textarea>
            </div>

            <div class="form-group">
                <label for="type" class="form-label">Type</label>
                <input type="text" id="type" [(ngModel)]="formData.type" name="type" class="form-input"
                    placeholder="Product">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="price" class="form-label">Price *</label>
                    <input type="number" id="price" [(ngModel)]="formData.price" name="price" required min="0"
                        step="0.01" class="form-input" placeholder="0.00">
                </div>

                <div class="form-group">
                    <label for="stock" class="form-label">Stock *</label>
                    <input type="number" id="stock" [(ngModel)]="formData.stock" name="stock" required min="0"
                        class="form-input" placeholder="0">
                </div>
            </div>

            <div class="form-group">
                <label for="category" class="form-label">Category</label>
                <input type="text" id="category" [(ngModel)]="formData.category" name="category" class="form-input"
                    placeholder="Enter category">
            </div>

            <div class="form-group">
                <label for="imageUrl" class="form-label">Image URL</label>
                <input type="url" id="imageUrl" [(ngModel)]="formData.imageUrl" name="imageUrl" class="form-input"
                    placeholder="https://example.com/image.jpg">
                <p class="text-xs text-gray-500 mt-1">Enter the URL of the product image</p>
            </div>

            <div class="modal-footer">
                <button type="button" (click)="onClose()" class="btn-cancel">
                    Cancel
                </button>
                <button type="submit" [disabled]="!isValid()" class="btn-submit">
                    {{ isEdit ? 'Update' : 'Create' }} Product
                </button>
            </div>
        </form>
    </div>
</div>
